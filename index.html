<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SVR Production Log</title>
    <meta name="description" content="Daily production logging for Sri Veera Raghava Sheet Metal Component." />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SVR Log" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        var t = localStorage.getItem('svr-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" class="boot"><p class="boot-text">Loading SVR Production Log…</p></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript><p style="padding:24px">SVR Production Log needs JavaScript enabled.</p></noscript>

    <script src="js/vendor/supabase.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
