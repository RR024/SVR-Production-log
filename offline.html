<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SVR Production Log</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#1b2a3a;font-family:system-ui,sans-serif;padding:24px}
      main{max-width:420px;text-align:center}
      h1{font-size:1.25rem;margin:16px 0 8px}
      p{color:#52627a;line-height:1.5;margin:0 0 20px}
      button{font:inherit;font-weight:600;padding:12px 20px;border:0;border-radius:8px;background:#1e3a5f;color:#fff;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1e3a5f"/><rect x="14" y="36" width="10" height="14" rx="2" fill="#7fb2ff"/><rect x="27" y="26" width="10" height="24" rx="2" fill="#a9ccff"/><rect x="40" y="14" width="10" height="36" rx="2" fill="#fff"/></svg>
      <h1>You're offline</h1>
      <p>SVR Production Log needs a connection to load and save production records. Nothing has been lost — reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
